[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aragon-research-api"
version = "1.0.0"
description = "Aragon Research Terminal — market data, report orchestration and versioning API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "jsonschema>=4.20,<5",
  "Jinja2>=3.1,<4",
  # ★V4-P2-5: pinyin search is a *default* capability, not an extra. Measured on
  # this machine, "optional" meant "absent", which silently disabled the only
  # dimension that makes a large instrument list navigable. ~1MB, pure Python, and
  # `search_index.pinyin_available()` still degrades softly if it is missing.
  "pypinyin>=0.51",
]

[project.optional-dependencies]
data = ["akshare>=1.12", "yfinance>=0.2.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "workspace"]

[tool.ruff.lint.per-file-ignores]
  # Long literal table rows / format strings: wrapping them would break the
  # output they generate. Line length is a style rule, not a correctness one.
  "app/services/exporter.py" = ["E501"]
  "app/agent/mock_runner.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E741: OHLC uses o/h/l/c/v by convention; those are not "ambiguous" here.
ignore = ["B008", "SIM108", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  # reports.run_id <-> runs.report_id is a deliberate cycle (spec §8.1);
  # create_all cannot order the DROP, which only affects the test fixture.
  "ignore:Can.t sort tables for DROP",
]
