# Aragon Trading Kanban — nginx site (aragon-trading v1)
# Managed alongside the pre-existing aragon-router sites; own server_name block only.

upstream aragon_trading_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream aragon_trading_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aragontrading.online www.aragontrading.online;

    # certbot --nginx inserts the ACME challenge + 301 redirect here.

    # ★v16 HSTS（spec §25.3.1c）：写在**server 级**。浏览器会忽略明文 HTTP 上的 HSTS
    #  （RFC 6797 §8.1），所以放在这里是安全的；`certbot --nginx` 把 443 监听并入这个块、
    #  另建一个只含 301 的 80 块之后，这条头自然落在 443 块里。
    #  - 180 天，**不带** includeSubDomains / preload：否则会把根域下其它（可能没有证书的）
    #    子站一并锁进 HTTPS。上线前用 `curl -I https://…` 核对。
    #  - ★nginx 的 add_header **不继承**：某个 location 只要自己写了 add_header，server 级的头就
    #    整体失效。下面 `/_next/static/` 与 `= /sw.js` 各有自己的 add_header（对静态资源无妨）；
    #    `/api/` 与 `/` 没有，所以 API 与页面都继承到 HSTS——**不要在 `/api/` 或 `/` 里再加 add_header**。
    add_header Strict-Transport-Security "max-age=15552000" always;

    # ★v15 用户与权限（已逐项核对，本文件无需改动）：
    #  - 不得给 /api/ 启用 proxy_cache：响应随 Cookie 里的身份而变，缓存层会把管理员的响应回放给游客
    #    （这里只有 `proxy_cache off;`，保持这样）。后端另给 /auth /admin /me /watchlist 发 `Cache-Control: private, no-store`。
    #  - Set-Cookie 默认原样透传（不要加 proxy_hide_header Set-Cookie / proxy_ignore_headers Set-Cookie）。
    #  - /api/ 与 /api/v1/reports 两个 location 都已 `proxy_set_header Host $host`：后端的 CSRF Origin 校验
    #    把 Origin 的 host 与 Host 头比较（忽略 scheme，TLS 在这里终止），缺了它所有生产写请求都会 403。
    #  - `X-Forwarded-For $proxy_add_x_forwarded_for` 把真实对端追加在最右，后端（TRUST_PROXY=1）只取最右一跳。

    access_log /var/log/nginx/aragon-trading.access.log;
    error_log  /var/log/nginx/aragon-trading.error.log;

    client_max_body_size 32m;

    # ── API: same-origin, so the browser needs no CORS and the service worker
    #    sees one origin. proxy_pass WITHOUT a URI keeps /api/v1/... intact —
    #    the FastAPI routers are mounted under /api/v1 on the backend too.
    location /api/ {
        proxy_pass http://aragon_trading_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE (/api/v1/runs/{id}/events, /asks/{id}/events) must stream, not buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Long-running report generation is a POST that returns 202 quickly, but the
    # export endpoint can stream a large file.
    # ★ 不能写成 `location /api/v1/reports/`（带尾斜杠）：nginx 对"名字以 / 结尾的
    #   前缀 location"有 auto_redirect —— 请求正好等于去掉尾斜杠的那个名字时（也就是
    #   报告库列表 `GET /api/v1/reports?...`），它会 301 补回尾斜杠；而 FastAPI 的
    #   redirect_slashes 又 307 剥掉尾斜杠，两边对踢 → 浏览器 ERR_TOO_MANY_REDIRECTS。
    #   前缀匹配不需要尾斜杠：`/api/v1/reports` 一样覆盖 `/api/v1/reports/{id}/export`。
    location /api/v1/reports {
        proxy_pass http://aragon_trading_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    # ── Web (Next.js standalone). Static assets are immutable-hashed.
    location /_next/static/ {
        proxy_pass http://aragon_trading_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must never be served stale (web/next.config.ts sets the
    # same rule at the Next layer; nginx must not re-add a long max-age).
    location = /sw.js {
        proxy_pass http://aragon_trading_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location / {
        proxy_pass http://aragon_trading_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
